{% extends "base.html" %}

{% block title %}Página no encontrada (404) | TechHelp IA{% endblock %}

{% block content %}
<div class="flex-1 flex items-center justify-center py-20 px-4 text-center">
    <div class="max-w-md w-full space-y-6">
        <div class="text-7xl font-mono font-extrabold text-indigo-500">404</div>
        <h1 class="text-2xl font-bold text-white">Ruta o recurso no encontrado</h1>
        <p class="text-sm text-slate-400">
            La página que estás buscando no existe o ha sido movida a otra ubicación.
        </p>
        <div class="pt-2">
            <a href="{{ url_for('main.index') }}" class="inline-flex items-center gap-2 py-3 px-6 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs shadow-lg transition">
                <i class="fa-solid fa-house"></i> Volver al Inicio
            </a>
        </div>
    </div>
</div>
{% endblock %}
