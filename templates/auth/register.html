{% extends "base.html" %}

{% block title %}Crear Cuenta | TechHelp IA{% endblock %}

{% block content %}
<div class="flex-1 flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 p-8 bg-slate-900/80 border border-slate-800 rounded-2xl shadow-2xl backdrop-blur-md">
        <div class="text-center">
            <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-indigo-600 to-emerald-400 p-0.5 mx-auto mb-4">
                <div class="w-full h-full bg-slate-950 rounded-[10px] flex items-center justify-center">
                    <i class="fa-solid fa-user-plus text-emerald-400 text-lg"></i>
                </div>
            </div>
            <h2 class="text-2xl font-bold text-white tracking-tight">Crea tu cuenta gratis</h2>
            <p class="mt-2 text-xs text-slate-400">
                ¿Ya tienes una cuenta? <a href="{{ url_for('auth.login') }}" class="text-indigo-400 hover:text-indigo-300 font-medium">Inicia sesión</a>
            </p>
        </div>

        <form class="mt-8 space-y-4" method="POST" action="{{ url_for('auth.register') }}">
            <div>
                <label for="name" class="block text-xs font-medium text-slate-300 mb-1.5">Nombre Completo</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500 text-xs">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <input id="name" name="name" type="text" required
                        value="{{ name or '' }}"
                        class="w-full pl-10 pr-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-slate-100 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500"
                        placeholder="Ej. Carlos Martínez">
                </div>
            </div>

            <div>
                <label for="email" class="block text-xs font-medium text-slate-300 mb-1.5">Correo Electrónico</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500 text-xs">
                        <i class="fa-solid fa-envelope"></i>
                    </div>
                    <input id="email" name="email" type="email" required autocomplete="email"
                        value="{{ email or '' }}"
                        class="w-full pl-10 pr-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-slate-100 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500"
                        placeholder="carlos@empresa.com">
                </div>
            </div>

            <div>
                <label for="password" class="block text-xs font-medium text-slate-300 mb-1.5">Contraseña (mínimo 6 caracteres)</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500 text-xs">
                        <i class="fa-solid fa-lock"></i>
                    </div>
                    <input id="password" name="password" type="password" required
                        class="w-full pl-10 pr-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-slate-100 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500"
                        placeholder="••••••••">
                </div>
            </div>

            <div>
                <label for="confirm_password" class="block text-xs font-medium text-slate-300 mb-1.5">Confirmar Contraseña</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500 text-xs">
                        <i class="fa-solid fa-lock-open"></i>
                    </div>
                    <input id="confirm_password" name="confirm_password" type="password" required
                        class="w-full pl-10 pr-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-slate-100 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500"
                        placeholder="••••••••">
                </div>
            </div>

            <div class="pt-2">
                <button type="submit"
                    class="w-full py-3 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm shadow-lg shadow-indigo-600/30 transition">
                    Crear Cuenta y Empezar
                </button>
            </div>
            
            <p class="text-[11px] text-center text-slate-500 pt-2">
                Al registrarte aceptas nuestros <a href="{{ url_for('main.terms') }}" class="underline hover:text-slate-400">Términos de Servicio</a> y <a href="{{ url_for('main.privacy') }}" class="underline hover:text-slate-400">Política de Privacidad</a>.
            </p>
        </form>
    </div>
</div>
{% endblock %}
