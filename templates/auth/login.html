{% extends "base.html" %}

{% block title %}Iniciar Sesión | TechHelp IA{% endblock %}

{% block content %}
<div class="flex-1 flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 p-8 bg-slate-900/80 border border-slate-800 rounded-2xl shadow-2xl backdrop-blur-md">
        <div class="text-center">
            <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-indigo-600 to-emerald-400 p-0.5 mx-auto mb-4">
                <div class="w-full h-full bg-slate-950 rounded-[10px] flex items-center justify-center">
                    <i class="fa-solid fa-lock text-indigo-400 text-lg"></i>
                </div>
            </div>
            <h2 class="text-2xl font-bold text-white tracking-tight">Accede a tu cuenta</h2>
            <p class="mt-2 text-xs text-slate-400">
                ¿No tienes cuenta? <a href="{{ url_for('auth.register') }}" class="text-indigo-400 hover:text-indigo-300 font-medium">Regístrate gratis</a>
            </p>
        </div>

        <form class="mt-8 space-y-5" method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
            <div>
                <label for="email" class="block text-xs font-medium text-slate-300 mb-1.5">Correo Electrónico</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500 text-xs">
                        <i class="fa-solid fa-envelope"></i>
                    </div>
                    <input id="email" name="email" type="email" required autocomplete="email"
                        value="{{ email or '' }}"
                        class="w-full pl-10 pr-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-slate-100 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500"
                        placeholder="tu@email.com">
                </div>
            </div>

            <div>
                <label for="password" class="block text-xs font-medium text-slate-300 mb-1.5">Contraseña</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500 text-xs">
                        <i class="fa-solid fa-key"></i>
                    </div>
                    <input id="password" name="password" type="password" required autocomplete="current-password"
                        class="w-full pl-10 pr-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-slate-100 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500"
                        placeholder="••••••••">
                </div>
            </div>

            <div class="flex items-center justify-between text-xs">
                <div class="flex items-center">
                    <input id="remember" name="remember" type="checkbox"
                        class="h-4 w-4 rounded bg-slate-950 border-slate-800 text-indigo-600 focus:ring-indigo-500">
                    <label for="remember" class="ml-2 text-slate-400">Recordarme</label>
                </div>
            </div>

            <button type="submit"
                class="w-full py-3 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm shadow-lg shadow-indigo-600/30 transition">
                Iniciar Sesión
            </button>
        </form>

        <!-- Botón Demo Rápido para Pruebas -->
        <div class="pt-4 border-t border-slate-800 text-center">
            <p class="text-[11px] text-slate-500 mb-2 font-mono">Credenciales de prueba rápida:</p>
            <button type="button" onclick="fillAdminDemo()"
                class="text-xs text-emerald-400 hover:text-emerald-300 font-mono py-1 px-3 rounded-lg bg-emerald-500/10 border border-emerald-500/20 transition">
                <i class="fa-solid fa-shield-halved mr-1"></i> Rellenar Administrador Demo
            </button>
        </div>
    </div>
</div>

<script>
function fillAdminDemo() {
    document.getElementById('email').value = 'admin@techhelp.ia';
    document.getElementById('password').value = 'Admin123456!';
}
</script>
{% endblock %}
